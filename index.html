<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080812"><title>adii ai — Your AI, your vibe</title>
<style>
:root{--bg:#080812;--panel:#101020;--panel2:#15152a;--line:#292744;--text:#f5f4ff;--muted:#a4a1bd;--purple:#9b5cff;--cyan:#45e6e0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#35205d 0,transparent 48%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100dvh}
button,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:1000px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid #ffffff12}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.7px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,var(--purple),var(--cyan));display:grid;place-items:center;color:#080812;font-weight:900;box-shadow:0 0 25px #9b5cff55}
.pill{font-size:12px;border:1px solid #45e6e055;color:var(--cyan);border-radius:99px;padding:5px 10px}
main{width:100%;max-width:820px;margin:0 auto;flex:1;display:flex;flex-direction:column}
.hero{text-align:center;padding:clamp(38px,9vh,90px) 0 28px}.orb{width:72px;height:72px;margin:0 auto 22px;border-radius:24px;background:linear-gradient(135deg,#a855f7,#40e5d9);display:grid;place-items:center;color:#080812;font-size:32px;box-shadow:0 0 60px #8b5cf655;transform:rotate(-5deg)}
h1{font-size:clamp(34px,7vw,58px);line-height:1.08;letter-spacing:-2px;margin:0 0 13px}h1 span{background:linear-gradient(90deg,#c69bff,#57eee5);background-clip:text;color:transparent}
.subtitle{color:var(--muted);max-width:490px;margin:auto;font-size:15px}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:24px 0 26px}
.suggestion{background:#111120;border:1px solid var(--line);border-radius:15px;text-align:left;padding:14px;transition:.2s}.suggestion:hover{border-color:#9b5cff;transform:translateY(-2px)}.suggestion b{display:block;font-size:14px;margin-bottom:4px}.suggestion small{color:var(--muted);font-size:12px}
.chat{padding:20px 0;display:flex;flex-direction:column;gap:18px;flex:1}.message{display:flex;gap:11px;align-items:flex-start}.avatar{width:32px;height:32px;flex:0 0 32px;border-radius:11px;display:grid;place-items:center;background:#24203a;color:#c9a5ff;font-weight:800}.message.user .avatar{background:#183d3c;color:var(--cyan)}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;background:#111120;border:1px solid #292744;border-radius:4px 16px 16px 16px;padding:13px 15px;max-width:100%}.message.user .bubble{background:#19172a;border-radius:16px 4px 16px 16px}.chat:empty{display:none}.typing{color:var(--muted);font-size:13px;padding:4px}
.composer-wrap{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 20%);padding:18px 0 12px}.composer{background:#111120;border:1px solid #393452;border-radius:20px;padding:12px;box-shadow:0 0 35px #7c3aed12}.composer:focus-within{border-color:#9b5cff;box-shadow:0 0 0 3px #9b5cff18}.composer textarea{width:100%;resize:none;min-height:48px;max-height:180px;border:0;outline:0;background:transparent;color:var(--text);padding:5px 4px}.composer textarea::placeholder{color:#77758f}.composer-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}.hint{font-size:11px;color:#77758f}.send{border:0;border-radius:12px;background:linear-gradient(135deg,#a855f7,#5b7cff);padding:10px 16px;font-weight:800;color:white}.send:disabled{opacity:.45;cursor:wait}.newchat{border:1px solid var(--line);background:#111120;border-radius:10px;padding:8px 12px;font-size:12px}.foot{text-align:center;color:#77758f;font-size:11px;padding:8px 0 18px}.error{color:#ff9aaf}
@media(max-width:520px){.app{padding:0 12px}.suggestions{grid-template-columns:1fr}.hero{padding-top:45px}.suggestion{padding:12px}.hint{max-width:180px}.pill{font-size:11px}}
</style></head>
<body><div class="app">
<header><div class="brand"><div class="logo">a✦</div><span>adii <span style="color:#a78bfa">ai</span></span></div><div style="display:flex;align-items:center;gap:10px"><span class="pill">✦ AI ASSISTANT</span><button class="newchat" id="newChat">New chat ↺</button></div></header>
<main>
<section class="hero" id="hero"><div class="orb">✦</div><h1>Hey, I'm <span>adii ai.</span></h1><p class="subtitle">Your ideas have no limits. Ask anything, explore everything, and let's make something amazing.</p>
<div class="suggestions" id="suggestions">
<button class="suggestion" data-prompt="Explain a difficult topic in simple words"><b>✧ Learn something</b><small>Explain anything, simply</small></button>
<button class="suggestion" data-prompt="Give me 5 creative ideas for a project"><b>✦ Get creative</b><small>Fresh ideas and inspiration</small></button>
<button class="suggestion" data-prompt="Help me write a cool Instagram bio"><b>⌘ Write something</b><small>Messages, stories, captions</small></button>
<button class="suggestion" data-prompt="Build a simple responsive website and explain the code"><b>⌁ Code with me</b><small>Debug, build, and learn</small></button>
</div></section>
<div class="chat" id="chat" aria-live="polite"></div>
<div class="composer-wrap"><form class="composer" id="form"><textarea id="prompt" rows="1" placeholder="Message adii ai..." aria-label="Message adii ai"></textarea><div class="composer-bottom"><span class="hint">Enter to send · Shift + Enter for a new line</span><button class="send" id="send" type="submit">Send ↗</button></div></form></div>
<div class="foot">adii ai can make mistakes. Check important information. Your API key stays on the server.</div>
</main></div>
<script>
const $=s=>document.querySelector(s), chat=$('#chat'), promptBox=$('#prompt'), form=$('#form'), send=$('#send'), hero=$('#hero');
let history=[];
function addMessage(role,text){const row=document.createElement('div');row.className='message '+(role==='user'?'user':'assistant');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=role==='user'?'Y':'✦';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;row.append(avatar,bubble);chat.append(row);row.scrollIntoView({behavior:'smooth',block:'nearest'});return row}
async function ask(text){text=text.trim();if(!text||send.disabled)return;hero.style.display='none';addMessage('user',text);history.push({role:'user',content:text});promptBox.value='';promptBox.style.height='auto';send.disabled=true;send.textContent='Thinking…';const loading=addMessage('assistant','adii ai is thinking…');loading.querySelector('.bubble').classList.add('typing');
try{const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});const data=await res.json();if(!res.ok)throw new Error(data.error||'Request failed');loading.querySelector('.bubble').classList.remove('typing');loading.querySelector('.bubble').textContent=data.reply||'I could not generate a response.';history.push({role:'assistant',content:data.reply||''})}
catch(e){loading.querySelector('.bubble').classList.remove('typing');loading.querySelector('.bubble').classList.add('error');loading.querySelector('.bubble').textContent='Connection issue: '+e.message+'. Check that the backend is running and your API key is configured.';history.pop()}
finally{send.disabled=false;send.textContent='Send ↗';promptBox.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();ask(promptBox.value)});
promptBox.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});
promptBox.addEventListener('input',()=>{promptBox.style.height='auto';promptBox.style.height=Math.min(promptBox.scrollHeight,180)+'px'});
document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{promptBox.value=b.dataset.prompt;ask(promptBox.value)}));
$('#newChat').addEventListener('click',()=>{history=[];chat.replaceChildren();hero.style.display='';promptBox.value='';promptBox.focus()});
</script></body></html>
